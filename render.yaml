services:
  - type: web
    name: letscode
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: letscode
          property: host
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: letscode
          property: host
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
